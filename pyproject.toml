[project]
name = "von-gold"
version = "0.1.0"
description = "Dry-run gold trading system: mechanical trend strategy with an optional local decision-model overlay"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15,<22",
    "fastapi>=0.110,<1",
    "uvicorn>=0.28,<1",
    "httpx>=0.27,<1",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
von-gold = "vongold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vongold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
